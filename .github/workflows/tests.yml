name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Internal QPSC packages are not published to PyPI; install them from
          # source (in dependency order) so the editable install below resolves.
          pip install \
            "microscope-imageprocessing @ git+https://github.com/uw-loci/microscope_imageprocessing@main" \
            "microscope-control @ git+https://github.com/uw-loci/microscope_control@main" \
            "ppm-library @ git+https://github.com/uw-loci/ppm_library@main"
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest
